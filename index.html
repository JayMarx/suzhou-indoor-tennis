<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0b7d3e" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>苏州室内网球场 · 速查</title>
<style>
  :root{
    --green:#0b7d3e; --green-d:#095f2f; --bg:#f3f5f4; --card:#fff;
    --text:#1c2620; --sub:#65726b; --chip:#eef4f0;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Roboto,sans-serif;
    background:var(--bg); color:var(--text); line-height:1.5;
    padding-bottom:calc(env(safe-area-inset-bottom) + 8px);
  }
  header{
    position:sticky; top:0; z-index:10;
    background:linear-gradient(135deg,var(--green),var(--green-d));
    color:#fff; padding:16px 16px 12px; padding-top:calc(14px + env(safe-area-inset-top));
    box-shadow:0 2px 10px rgba(0,0,0,.12);
  }
  .title{display:flex;align-items:center;gap:8px;font-size:19px;font-weight:700}
  .title small{font-weight:400;opacity:.85;font-size:12px}
  .search{
    margin-top:12px; display:flex; align-items:center; gap:8px;
    background:rgba(255,255,255,.96); border-radius:12px; padding:11px 12px;
  }
  .search input{border:0; outline:0; width:100%; font-size:16px; background:transparent; color:#111}
  .toolbar{display:flex; gap:8px; margin-top:10px}
  .near{
    flex:0 0 auto; display:flex; align-items:center; gap:6px;
    background:rgba(255,255,255,.16); color:#fff; border:1px solid rgba(255,255,255,.35);
    border-radius:20px; padding:8px 14px; font-size:14px; font-weight:600; cursor:pointer;
  }
  .near.on{background:#fff; color:var(--green-d); border-color:#fff}
  .near.loading{opacity:.7}
  .chips{display:flex; gap:8px; overflow-x:auto; padding:12px 16px 4px; scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto; padding:7px 14px; border-radius:20px; background:var(--card);
    color:var(--sub); font-size:14px; border:1px solid #e2e8e4; white-space:nowrap; cursor:pointer;
  }
  .chip.active{background:var(--green); color:#fff; border-color:var(--green)}
  .count{padding:2px 16px 6px; color:var(--sub); font-size:13px; display:flex; justify-content:space-between; align-items:center}
  .count .hint{font-size:12px; color:#9aa39c}
  .list{padding:4px 12px 24px; display:flex; flex-direction:column; gap:12px}
  .card{background:var(--card); border-radius:16px; padding:14px 14px 12px; box-shadow:0 1px 4px rgba(20,40,30,.06); position:relative}
  .card h2{margin:0 34px 0 0; font-size:17px; font-weight:700; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
  .tag{font-size:11px; font-weight:600; padding:2px 8px; border-radius:6px; background:var(--chip); color:var(--green-d)}
  .tag.film{background:#eaf1ff; color:#2456c7}
  .tag.pro{background:#fff2e6; color:#c26a12}
  .fav{position:absolute; top:12px; right:10px; font-size:22px; line-height:1; cursor:pointer; color:#d9dfdb; user-select:none}
  .fav.on{color:#f5a623}
  .addr{color:var(--sub); font-size:14px; margin:8px 0 4px; display:flex; gap:6px}
  .addr svg{flex:0 0 auto; margin-top:3px}
  .dist{color:var(--green); font-weight:600; font-size:13px; margin:2px 0 6px}
  .note{color:#8a938c; font-size:12.5px; margin:2px 0 10px}
  .actions{display:flex; gap:10px}
  .btn{flex:1; text-align:center; text-decoration:none; font-size:15px; font-weight:600; padding:11px 0; border-radius:10px; display:flex; align-items:center; justify-content:center; gap:6px; border:0; cursor:pointer}
  .btn.nav{background:var(--green); color:#fff}
  .btn.call{background:var(--chip); color:var(--green-d)}
  .btn.call.disabled{opacity:.45; pointer-events:none}
  .empty{text-align:center; color:var(--sub); padding:48px 20px}
  .toTop{position:fixed; right:16px; bottom:calc(20px + env(safe-area-inset-bottom)); width:44px; height:44px; border-radius:50%; background:var(--green); color:#fff; border:0; font-size:20px; box-shadow:0 4px 12px rgba(0,0,0,.2); display:none; align-items:center; justify-content:center; cursor:pointer; z-index:20}
  .toTop.show{display:flex}
  footer{text-align:center; color:#9aa39c; font-size:12px; padding:8px 24px 28px; line-height:1.6}
</style>
</head>
<body>
<header>
  <div class="title">🎾 苏州室内网球场 <small>速查 · 手机版</small></div>
  <div class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0b7d3e" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
    <input id="q" type="search" placeholder="搜索场馆名 / 地址 / 地区" autocomplete="off" />
  </div>
  <div class="toolbar">
    <button class="near" id="near">📍 离我最近</button>
    <button class="near" id="favBtn">⭐ 收藏</button>
  </div>
</header>

<div class="chips" id="chips"></div>
<div class="count" id="count"></div>
<div class="list" id="list"></div>
<button class="toTop" id="toTop" aria-label="返回顶部">↑</button>

<footer>
  数据整理自公开信息，仅供参考，出行前请电话确认场地与价格。<br/>
  建议在「苏体通 / 大众点评 / 动网」小程序查看实时空场与预约。
</footer>

<script>
// ── 苏州室内网球场数据（lat/lng 为近似坐标，用于距离排序）──────────
const VENUES = [
  { name:"苏州奥林匹克体育中心网球馆", area:"工业园区", addr:"工业园区星塘街1888号 奥体中心", phone:"", tags:["室内","专业"], note:"多片标准室内场，赛事级场馆", lat:31.2712, lng:120.7385 },
  { name:"苏州工业园区体育中心网球馆", area:"工业园区", addr:"工业园区苏虹中路68号（近金鸡湖）", phone:"0512-66680114", tags:["室内","专业"], note:"多块室内场，设青少年及成人教学班", lat:31.3178, lng:120.6790 },
  { name:"苏州科技文化艺术中心网球馆（苏艺）", area:"工业园区", addr:"工业园区观枫街1号", phone:"", tags:["室内"], note:"环境雅致，部分场地半室内", lat:31.3230, lng:120.6810 },
  { name:"轻空间气膜网球馆（园区）", area:"工业园区", addr:"工业园区（气膜馆，具体点位见大众点评）", phone:"", tags:["气膜","室内"], note:"四季恒温、新风照明，全天候", lat:31.2950, lng:120.7300 },
  { name:"苏州高新区文体中心网球馆", area:"高新区", addr:"高新区狮山路文体中心", phone:"", tags:["室内"], note:"场地新，交通便利，可团体包场", lat:31.3050, lng:120.5760 },
  { name:"吴中区文体中心网球馆", area:"吴中区", addr:"吴中区越溪街道吴中大道199号", phone:"", tags:["室内"], note:"大型体育综合体，支持年卡/次卡/临时", lat:31.2320, lng:120.5860 },
  { name:"吴江网球中心", area:"吴江区", addr:"吴江区体育路609号", phone:"13914026620", tags:["室内"], note:"室内+室外，9:00-21:00，每场限1小时", lat:31.1590, lng:120.6390 },
  { name:"苏州市市民健身中心网球场", area:"姑苏区", addr:"姑苏区五卅路175号", phone:"0512-65227806", tags:["半室内"], note:"部分时段半室内遮棚，「苏体健身+」预约", lat:31.3080, lng:120.6240 },
  { name:"昆山市体育中心网球馆", area:"昆山市", addr:"昆山市体育中心内（详见苏体通）", phone:"", tags:["室内"], note:"室内外球场，设施完善", lat:31.3860, lng:120.9800 },
  { name:"相城区文体中心网球馆", area:"相城区", addr:"相城区社区文体中心（详见苏体通）", phone:"", tags:["室内"], note:"小程序/电话预约", lat:31.3690, lng:120.6420 },
  { name:"太仓市体育中心网球馆", area:"太仓市", addr:"太仓市体育中心内（详见苏体通）", phone:"", tags:["室内"], note:"室内外球场", lat:31.4520, lng:121.1080 },
  { name:"张家港市体育中心网球馆", area:"张家港市", addr:"张家港市体育中心内（详见苏体通）", phone:"", tags:["室内"], note:"室内外球场", lat:31.8760, lng:120.5550 },
];

const AREAS = ["全部", ...Array.from(new Set(VENUES.map(v=>v.area)))];
let curArea="全部", curQ="", myPos=null, favOnly=false;
const favs = new Set(JSON.parse(localStorage.getItem("szt_favs")||"[]"));

const chipsEl=document.getElementById("chips"), listEl=document.getElementById("list"),
      countEl=document.getElementById("count"), qEl=document.getElementById("q"),
      nearBtn=document.getElementById("near"), favBtn=document.getElementById("favBtn"),
      toTop=document.getElementById("toTop");

AREAS.forEach(a=>{
  const c=document.createElement("div");
  c.className="chip"+(a===curArea?" active":""); c.textContent=a;
  c.onclick=()=>{ curArea=a; [...chipsEl.children].forEach(x=>x.classList.toggle("active",x.textContent===a)); render(); };
  chipsEl.appendChild(c);
});

qEl.addEventListener("input",e=>{ curQ=e.target.value.trim().toLowerCase(); render(); });

nearBtn.onclick=()=>{
  if(myPos){ myPos=null; nearBtn.classList.remove("on"); render(); return; }
  if(!navigator.geolocation){ alert("当前浏览器不支持定位"); return; }
  nearBtn.classList.add("loading"); nearBtn.textContent="📍 定位中…";
  navigator.geolocation.getCurrentPosition(
    p=>{ myPos={lat:p.coords.latitude,lng:p.coords.longitude}; nearBtn.classList.remove("loading"); nearBtn.classList.add("on"); nearBtn.textContent="📍 离我最近"; render(); },
    ()=>{ nearBtn.classList.remove("loading"); nearBtn.textContent="📍 离我最近"; alert("定位失败，请在浏览器允许定位权限"); },
    {enableHighAccuracy:true,timeout:8000}
  );
};

favBtn.onclick=()=>{ favOnly=!favOnly; favBtn.classList.toggle("on",favOnly); render(); };

function haversine(a,b){
  const R=6371, dLat=(b.lat-a.lat)*Math.PI/180, dLng=(b.lng-a.lng)*Math.PI/180;
  const s=Math.sin(dLat/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(s),Math.sqrt(1-s));
}
function mapLink(v){
  const kw=encodeURIComponent(v.name+" "+v.addr);
  return "https://uri.amap.com/marker/?position="+v.lng+","+v.lat+"&name="+encodeURIComponent(v.name)+"&src=web&callnative=1";
}
function tagClass(t){ return t==="气膜"?"tag film":(t==="专业"?"tag pro":"tag"); }
function toggleFav(name){
  if(favs.has(name)) favs.delete(name); else favs.add(name);
  localStorage.setItem("szt_favs",JSON.stringify([...favs])); render();
}

function render(){
  let items=VENUES.map(v=>({...v, dist: myPos?haversine(myPos,v):null}));
  items=items.filter(v=>{
    if(favOnly && !favs.has(v.name)) return false;
    if(curArea!=="全部" && v.area!==curArea) return false;
    if(curQ){ const hay=(v.name+v.addr+v.area+v.tags.join("")+v.note).toLowerCase(); if(!hay.includes(curQ)) return false; }
    return true;
  });
  if(myPos) items.sort((a,b)=>a.dist-b.dist);

  countEl.innerHTML="<span>共 "+items.length+" 个场馆</span>"+(myPos?'<span class="hint">已按距离排序</span>':'');
  if(!items.length){ listEl.innerHTML='<div class="empty">没有匹配的场馆，换个条件试试～</div>'; return; }

  listEl.innerHTML=items.map(v=>{
    const tags=v.tags.map(t=>`<span class="${tagClass(t)}">${t}</span>`).join("");
    const call=v.phone?`<a class="btn call" href="tel:${v.phone}">📞 拨打</a>`:`<span class="btn call disabled">📞 暂无电话</span>`;
    const dist=v.dist!=null?`<div class="dist">🚗 约 ${v.dist<1?Math.round(v.dist*1000)+" 米":v.dist.toFixed(1)+" 公里"}</div>`:"";
    const on=favs.has(v.name)?" on":"";
    return `<div class="card">
      <span class="fav${on}" onclick="toggleFav('${v.name.replace(/'/g,"\\'")}')">${favs.has(v.name)?"★":"☆"}</span>
      <h2>${v.name} ${tags}</h2>
      <div class="addr">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#65726b" stroke-width="2"><path d="M12 21s-7-6.3-7-11a7 7 0 1 1 14 0c0 4.7-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
        <span>${v.addr}</span>
      </div>
      ${dist}
      ${v.note?`<div class="note">${v.note}</div>`:""}
      <div class="actions">
        <a class="btn nav" href="${mapLink(v)}" target="_blank" rel="noopener">🧭 地图导航</a>
        ${call}
      </div>
    </div>`;
  }).join("");
}

window.addEventListener("scroll",()=>{ toTop.classList.toggle("show",window.scrollY>400); });
toTop.onclick=()=>window.scrollTo({top:0,behavior:"smooth"});
window.toggleFav=toggleFav;
render();
</script>
</body>
</html>
