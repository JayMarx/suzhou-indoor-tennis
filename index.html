<body>
<div class="hero">
  <div class="hero-ball" aria-hidden="true"></div>
  <svg class="hero-court" viewBox="0 0 160 240" aria-hidden="true">
    <rect x="10" y="10" width="140" height="220" rx="2" fill="none" stroke="rgba(198,242,78,.85)" stroke-width="3"/>
    <line x1="10" y1="120" x2="150" y2="120" stroke="rgba(198,242,78,.85)" stroke-width="3"/>
    <rect x="30" y="60" width="100" height="120" fill="none" stroke="rgba(198,242,78,.55)" stroke-width="2"/>
    <line x1="80" y1="60" x2="80" y2="180" stroke="rgba(198,242,78,.55)" stroke-width="2"/>
    <circle cx="80" cy="120" r="12" fill="rgba(198,242,78,.9)"/>
  </svg>
  <h1>🎾 苏州室内网球场</h1>
  <p>雨天酷暑寒冬都能打 · 按距离找场，一键导航与拨打</p>
  <div class="hero-stats">
    <span class="stat">全市 <b id="heroCount">20</b> 家场馆</span>
    <span class="stat">覆盖 <b id="heroAreas">10</b>+ 区县</span>
    <span class="stat">含气膜恒温馆</span>
  <div class="hero-tools">
    <div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0b7d3e" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
      <input id="q" type="search" placeholder="搜索场馆名 / 地址 / 地区" autocomplete="off" />
    </div>
    <div class="toolbar">
      <button class="pill" id="near">📍 离我最近</button>
      <button class="pill" id="favBtn">⭐ 收藏</button>
    </div>
  </div>
</div>

<div class="home-section-title">附近推荐</div>
<div class="list" id="list"></div>
<button class="toTop" id="toTop" aria-label="返回顶部">↑</button>
